version: '3.8'

services:
  vllm:
    image: vllm-cpu-optimized:latest
    container_name: vllm-cpu
    ports:
      - "8000:8000"
    environment:
      # CPU Configuration
      VLLM_CPU_KVCACHE_SPACE: "4"              # 4GB for KV cache
      VLLM_CPU_OMP_THREADS_BIND: "0-9"        # CPU cores to use (adjust for your CPU)
      VLLM_CPU_DISABLE_AVX512: "true"         # Disable AVX512 (set to false if your CPU supports it)
      
      # Memory Management
      LD_PRELOAD: "/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4"
      
      # Model Configuration
      VLLM_DTYPE: "auto"                      # auto, float32, or bfloat16
      
      # Logging
      VLLM_LOGGING_LEVEL: "INFO"              # DEBUG, INFO, WARNING, ERROR
    
    command:
      - --model=facebook/opt-125m             # Change to your desired model
      - --dtype=float32                        # Use float32 for compatibility
      - --max-model-len=2048                   # Maximum sequence length
      - --host=0.0.0.0
      - --port=8000
    
    volumes:
      # Cache Hugging Face models locally
      - ~/.cache/huggingface:/root/.cache/huggingface
    
    shm_size: 4gb                              # Shared memory size (increase for larger models)
    
    # Resource Limits (optional, adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '10'                           # Limit CPU cores
          memory: 16G                          # Memory limit
        reservations:
          cpus: '4'
          memory: 8G
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Optional: Prometheus for metrics
